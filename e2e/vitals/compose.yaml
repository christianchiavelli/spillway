# The stack the Web Vitals are measured on, laid over compose.yaml:
#
#   docker compose --file compose.yaml --file e2e/vitals/compose.yaml up --wait --build
#
# The sync stays off, and the sums of the ONS's files as they were synced once
# (sums.sql.gz) are restored before the API starts, so every run measures the
# same pages on the same data, with nothing on the machine reaching out. A
# project of its own, so its database is never the one a laptop's stack keeps;
# it takes the same port, so that stack is stopped first.
name: spillway-vitals

services:
  sync:
    # Only started when asked for by name, which this stack never does.
    profiles: [sync]

  restore:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    command:
      - sh
      - -c
      - gunzip --stdout /sums.sql.gz | psql --quiet --single-transaction --set ON_ERROR_STOP=1
    environment:
      PGHOST: db
      PGUSER: spillway
      PGPASSWORD: ${POSTGRES_PASSWORD:-spillway}
      PGDATABASE: spillway
    volumes:
      - ./e2e/vitals/sums.sql.gz:/sums.sql.gz:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    depends_on:
      restore:
        condition: service_completed_successfully
