# Queries are SQL in internal/adapter/postgres/queries, checked against the
# migrations at generation time; sqlc writes the Go that runs them.
version: '2'
sql:
  - engine: postgresql
    schema: internal/adapter/postgres/migrations
    queries: internal/adapter/postgres/queries
    gen:
      go:
        package: sqlcdb
        out: internal/adapter/postgres/sqlcdb
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          # The standard library's uuid package, new in Go 1.27, instead of a module.
          - db_type: uuid
            go_type: uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
