openapi: 3.1.1
info:
  title: Spillway API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    The API behind Spillway's web app.

    Only the SvelteKit server calls it. Browsers never reach it, so it allows no
    cross-origin requests, and it reads the session from a bearer token that the
    web server keeps in an HTTP-only cookie.

    Every error is an RFC 9457 problem. `code` says what went wrong in words a
    program can switch on, and `errors` points at the fields to blame.

    Energy is in megawatt hours (MWh). Days are calendar days in Brasília, the
    grid operator's clock, and instants are in UTC.

servers:
  - url: http://api:8080
    description: Inside the compose network

security:
  - session: []

tags:
  - name: accounts
    description: Who can sign in
  - name: sessions
    description: Signing in and out
  - name: alerts
    description: Thresholds on curtailed wind and solar energy, per subsystem
  - name: curtailment
    description: |
      The wind and solar energy the ONS kept from being generated, from the
      files it publishes. Public and read only. Until the first file is loaded,
      a few minutes after a fresh start, these operations answer `503` with
      code `data_unavailable`.

paths:
  /v1/accounts:
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account and start its first session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: The account, with a session already started for it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrant'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Sign in with an email and a password
      description: |
        Wrong credentials answer `400` with code `invalid_credentials`, whether
        the email exists or not, the way an OAuth token endpoint answers
        `invalid_grant`: `401` only ever means a missing or refused session.
        Repeated failures for one email answer `429` with code `rate_limited`
        and a `Retry-After` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: A new session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrant'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      tags: [sessions]
      summary: Read the session the token belongs to
      description: |
        Reading a session can extend it. `expiresAt` is always the current
        deadline, so the caller can keep its cookie in step.
      responses:
        '200':
          description: The session and its account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCurrentSession
      tags: [sessions]
      summary: Sign out
      responses:
        '204':
          description: The session is over
        default:
          $ref: '#/components/responses/Problem'

  /v1/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List the account's alerts, newest first
      description: An account holds at most 20 alerts, so the list is never paged.
      responses:
        '200':
          description: Every alert of the account, with what its threshold met in the data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create an alert
      description: |
        Names are unique per account, ignoring case: a repeated name answers
        `409` with code `conflict` and the error at `/name`. An account that
        already holds 20 alerts answers `409` with code `alert_limit_reached`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAlert'
      responses:
        '201':
          description: The alert as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        default:
          $ref: '#/components/responses/Problem'

  /v1/alerts/firings:
    get:
      operationId: listFirings
      tags: [alerts]
      summary: List the days the account's alerts fired, newest first
      description: |
        An alert fires on each day its source, in its subsystem, loses more
        energy than its threshold. The days are the 30 up to the latest the ONS
        has published, read from the data as it stands: when the ONS revises a
        day, its firings follow. Before any data is loaded the page is empty.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of firings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiringPage'
        default:
          $ref: '#/components/responses/Problem'

  /v1/alerts/{alertId}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert
      description: Another account's alert answers `404`, as if it did not exist.
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The alert is gone
        default:
          $ref: '#/components/responses/Problem'

  /v1/curtailment:
    get:
      operationId: getCurtailment
      tags: [curtailment]
      summary: Read a period's curtailment, by source, time, subsystem and reason
      description: |
        The period is the day, the week from Monday or the calendar month that
        holds `date`, the latest day published when it is left out. A day the
        data does not reach answers `404`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: The period's curtailment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curtailment'
        default:
          $ref: '#/components/responses/Problem'

  /v1/curtailment/months:
    get:
      operationId: listMonthlyCurtailment
      tags: [curtailment]
      summary: List every month the ONS has published, oldest first
      security: []
      responses:
        '200':
          description: Every month, the whole grid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyCurtailment'
        default:
          $ref: '#/components/responses/Problem'

  /v1/curtailment/days:
    get:
      operationId: listDailyCurtailment
      tags: [curtailment]
      summary: List the latest days, by source and subsystem
      description: |
        Every source and subsystem, each with one figure a day, from the oldest
        day to the latest published.
      security: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: The latest days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyCurtailment'
        default:
          $ref: '#/components/responses/Problem'

  /v1/plants:
    get:
      operationId: listPlants
      tags: [curtailment]
      summary: List the plants a period's limits cost energy, most first
      description: |
        A plant can be one plant or a group of plants that share one connection
        to the grid, as the ONS reports them. Only the plants that lost energy
        in the period are listed; `reporting` counts every plant that reported.
      security: []
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Date'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/Source'
        - name: subsystem
          in: query
          schema:
            $ref: '#/components/schemas/Subsystem'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of the plants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantRanking'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The opaque token from a `SessionGrant`.

  parameters:
    Period:
      name: period
      in: query
      description: How long the period runs
      schema:
        $ref: '#/components/schemas/PeriodKind'
    Date:
      name: date
      in: query
      description: A day in the period. The latest day published when left out.
      schema:
        $ref: '#/components/schemas/Day'
    Offset:
      name: offset
      in: query
      description: How many items to skip
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0

  responses:
    Problem:
      description: Anything other than success, as an RFC 9457 problem
      headers:
        Retry-After:
          description: Seconds to wait, sent with `429` and `503` only
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: |
            The challenge sent with `401` only: `Bearer` when no session came
            with the request, `Bearer error="invalid_token"` when the one that
            came is over or unknown (RFC 6750)
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      examples: [ana@example.com]

    NewAccount:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          description: |
            At least 15 characters, as NIST SP 800-63B-4 asks of a password that
            is the only factor. No rules about which characters.
          type: string
          minLength: 15
          maxLength: 128

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          description: Checked as given. The length rule of a new password is not repeated here.
          type: string
          minLength: 1
          maxLength: 128

    Account:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'

    SessionGrant:
      type: object
      required: [token, expiresAt, account]
      properties:
        token:
          description: Opaque. Keep it out of logs and out of the browser's reach.
          type: string
        expiresAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/Account'

    CurrentSession:
      type: object
      required: [expiresAt, account]
      properties:
        expiresAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/Account'

    Source:
      description: Where the curtailed energy would have come from
      type: string
      enum: [wind, solar]

    Subsystem:
      description: |
        A subsystem of Brazil's interconnected grid, as the ONS names them:
        `N` North, `NE` Northeast, `SE` Southeast and Centre-West, `S` South.
      type: string
      # Quoted on purpose: a YAML 1.1 parser, like the one ogen uses, reads a bare N as false.
      enum: ['N', 'NE', 'SE', 'S']

    AlertName:
      description: Unique per account, ignoring case. Spaces at either end are trimmed.
      type: string
      minLength: 1
      maxLength: 80

    Threshold:
      description: Curtailed energy in one day, in MWh, that sets the alert off
      type: integer
      format: int32
      minimum: 1
      maximum: 1000000

    NewAlert:
      type: object
      additionalProperties: false
      required: [name, source, subsystem, thresholdMwh]
      properties:
        name:
          $ref: '#/components/schemas/AlertName'
        source:
          $ref: '#/components/schemas/Source'
        subsystem:
          $ref: '#/components/schemas/Subsystem'
        thresholdMwh:
          $ref: '#/components/schemas/Threshold'

    Alert:
      type: object
      required: [id, name, source, subsystem, thresholdMwh, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/AlertName'
        source:
          $ref: '#/components/schemas/Source'
        subsystem:
          $ref: '#/components/schemas/Subsystem'
        thresholdMwh:
          $ref: '#/components/schemas/Threshold'
        createdAt:
          type: string
          format: date-time

    WatchedAlert:
      description: An alert, with what its threshold met in the data
      allOf:
        - $ref: '#/components/schemas/Alert'
        - type: object
          required: [daysFired]
          properties:
            lastFiredOn:
              description: The latest day it fired. Left out if it never has.
              $ref: '#/components/schemas/Day'
            daysFired:
              description: The days it fired in the 30 up to the latest published
              type: integer
              format: int32
              minimum: 0
              maximum: 30

    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/WatchedAlert'

    Firing:
      description: A day an alert's source, in its subsystem, lost more than its threshold
      type: object
      required: [alertId, alertName, day, curtailedMwh, thresholdMwh]
      properties:
        alertId:
          type: string
          format: uuid
        alertName:
          $ref: '#/components/schemas/AlertName'
        day:
          $ref: '#/components/schemas/Day'
        curtailedMwh:
          $ref: '#/components/schemas/Energy'
        thresholdMwh:
          $ref: '#/components/schemas/Threshold'

    FiringPage:
      type: object
      required: [total, items]
      properties:
        from:
          description: The first day the firings cover. Left out before any data is loaded.
          $ref: '#/components/schemas/Day'
        through:
          description: The last day the firings cover, the latest published
          $ref: '#/components/schemas/Day'
        total:
          description: The firings in all the days, on every page
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Firing'

    Day:
      description: A calendar day in Brasília
      type: string
      format: date
      examples: ['2026-10-16']

    Energy:
      description: Energy in MWh
      type: number
      format: double

    PeriodKind:
      description: |
        `day`, `week`, from Monday to Sunday, or `month`, a calendar month.
        The day when left out.
      type: string
      enum: [day, week, month]
      default: day

    Period:
      description: |
        A day, a week or a month, read up to the latest day published, and the
        span before it that it is compared with: as many days of the period
        before as this one has, so a week so far is compared with the same days
        of the week before.
      type: object
      required: [kind, start, end, through]
      properties:
        kind:
          $ref: '#/components/schemas/PeriodKind'
        start:
          $ref: '#/components/schemas/Day'
        end:
          description: The last day, which may not be published yet
          $ref: '#/components/schemas/Day'
        through:
          description: The last day with data, `end` or the latest published
          $ref: '#/components/schemas/Day'
        previousStart:
          description: The first day compared with. Left out where the data does not reach.
          $ref: '#/components/schemas/Day'
        previousEnd:
          $ref: '#/components/schemas/Day'
        earlier:
          description: A day of the period before. Left out where the data does not reach.
          $ref: '#/components/schemas/Day'
        later:
          description: A day of the period after. Left out until it is published.
          $ref: '#/components/schemas/Day'

    Reason:
      description: |
        Why the ONS limited a plant, as it codes it: `ENE` the plants could
        make more than the grid was using, `CNF` held back to keep the grid
        reliable, `REL` equipment outside the plant, mostly transmission, could
        not carry it, `PAR` a limit set in the plant's terms of connection.
      type: string
      enum: [ENE, CNF, REL, PAR]

    SourceEnergy:
      description: What a source generated, and what the ONS kept it from generating
      type: object
      required: [curtailedMwh, generatedMwh]
      properties:
        curtailedMwh:
          $ref: '#/components/schemas/Energy'
        generatedMwh:
          $ref: '#/components/schemas/Energy'

    Slot:
      description: A half hour or a day, and what each source lost in it
      type: object
      required: [start, windMwh, solarMwh]
      properties:
        start:
          type: string
          format: date-time
        windMwh:
          $ref: '#/components/schemas/Energy'
        solarMwh:
          $ref: '#/components/schemas/Energy'

    SubsystemSplit:
      type: object
      required: [subsystem, windMwh, solarMwh]
      properties:
        subsystem:
          $ref: '#/components/schemas/Subsystem'
        windMwh:
          $ref: '#/components/schemas/Energy'
        solarMwh:
          $ref: '#/components/schemas/Energy'

    ReasonSplit:
      type: object
      required: [reason, windMwh, solarMwh]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
        windMwh:
          $ref: '#/components/schemas/Energy'
        solarMwh:
          $ref: '#/components/schemas/Energy'

    Curtailment:
      type: object
      required:
        [
          period,
          publishedThrough,
          wind,
          solar,
          plantsLimited,
          plantsReporting,
          series,
          bySubsystem,
          byReason,
        ]
      properties:
        period:
          $ref: '#/components/schemas/Period'
        publishedThrough:
          description: The start of the last half hour published
          type: string
          format: date-time
        wind:
          $ref: '#/components/schemas/SourceEnergy'
        solar:
          $ref: '#/components/schemas/SourceEnergy'
        previousCurtailedMwh:
          description: What both sources lost in the span compared with, when the period has one
          $ref: '#/components/schemas/Energy'
        plantsLimited:
          description: The plants that lost energy in the period
          type: integer
          minimum: 0
        plantsReporting:
          description: The plants that reported in the period
          type: integer
          minimum: 0
        series:
          description: |
            The half hours of a day, or the days of a week or a month, from the
            first to the latest published
          type: array
          maxItems: 48
          items:
            $ref: '#/components/schemas/Slot'
        bySubsystem:
          description: All four subsystems
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/SubsystemSplit'
        byReason:
          description: The reasons the ONS gave in the period
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ReasonSplit'

    PlantCurtailment:
      description: A plant's period
      type: object
      required: [id, name, state, subsystem, source, curtailedMwh, generatedMwh, limitedMinutes]
      properties:
        id:
          description: The ONS's id for the plant or group
          type: string
        name:
          type: string
        state:
          description: The two letters of a Brazilian state
          type: string
        subsystem:
          $ref: '#/components/schemas/Subsystem'
        source:
          $ref: '#/components/schemas/Source'
        curtailedMwh:
          $ref: '#/components/schemas/Energy'
        generatedMwh:
          $ref: '#/components/schemas/Energy'
        limitedMinutes:
          description: The minutes the ONS held it under a limit, at most a month's
          type: integer
          format: int32
          minimum: 0
          maximum: 44640

    PlantRanking:
      type: object
      required: [period, publishedThrough, reporting, total, items]
      properties:
        period:
          $ref: '#/components/schemas/Period'
        publishedThrough:
          type: string
          format: date-time
        reporting:
          description: The plants that reported in the period
          type: integer
          minimum: 0
        total:
          description: The plants that lost energy, on every page
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PlantCurtailment'

    MonthCurtailment:
      type: object
      required: [month]
      properties:
        month:
          description: The month's first day
          $ref: '#/components/schemas/Day'
        wind:
          description: Left out before the ONS published the source
          $ref: '#/components/schemas/SourceEnergy'
        solar:
          description: Left out before the ONS published the source
          $ref: '#/components/schemas/SourceEnergy'

    MonthlyCurtailment:
      type: object
      required: [publishedThrough, months]
      properties:
        publishedThrough:
          type: string
          format: date-time
        months:
          type: array
          items:
            $ref: '#/components/schemas/MonthCurtailment'

    SubsystemDays:
      type: object
      required: [source, subsystem, curtailedMwh]
      properties:
        source:
          $ref: '#/components/schemas/Source'
        subsystem:
          $ref: '#/components/schemas/Subsystem'
        curtailedMwh:
          description: One figure a day, the oldest first
          type: array
          maxItems: 90
          items:
            $ref: '#/components/schemas/Energy'

    DailyCurtailment:
      type: object
      required: [from, to, series]
      properties:
        from:
          $ref: '#/components/schemas/Day'
        to:
          $ref: '#/components/schemas/Day'
        series:
          description: Every source and subsystem
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SubsystemDays'

    ProblemCode:
      description: |
        What went wrong, for programs to switch on. New codes may be added, so
        treat an unknown one as `internal`.
      type: string
      enum:
        - malformed_request
        - validation_failed
        - unauthenticated
        - invalid_credentials
        - forbidden_origin
        - not_found
        - method_not_allowed
        - conflict
        - alert_limit_reached
        - request_too_large
        - unsupported_media_type
        - rate_limited
        - data_unavailable
        - internal

    FieldError:
      type: object
      required: [pointer, code]
      properties:
        pointer:
          description: JSON Pointer (RFC 6901) to the field in the request body
          type: string
          examples: [/name]
        code:
          description: |
            One of `required`, `too_short`, `too_long`, `out_of_range`,
            `invalid` or `taken`. New codes may be added.
          type: string

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: A URI naming the problem type. `about:blank` when the status says it all.
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
